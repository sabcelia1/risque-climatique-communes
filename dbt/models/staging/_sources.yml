version: 2

sources:
  - name: raw
    description: >
      Tables produites par src/clean.py. Dans BigQuery, elles sont chargées dans
      le jeu de données `risque_raw` par src/load_bigquery.py ; en local (DuckDB),
      elles sont lues directement dans les fichiers Parquet.
    schema: risque_raw
    tables:
      - name: catnat
        description: Arrêtés CatNat nettoyés (une ligne par reconnaissance).
        config:
          meta:
            external_location: "{{ env_var('DONNEES_DIR', 'data/processed') }}/catnat.parquet"
      - name: communes
        description: Référentiel des communes actuelles (API Découpage administratif).
        config:
          meta:
            external_location: "{{ env_var('DONNEES_DIR', 'data/processed') }}/communes.parquet"

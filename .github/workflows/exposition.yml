# Calcul ponctuel (la géologie ne change pas) de l'exposition des communes aux argiles.
# Lancement manuel : onglet Actions -> « Exposition aux argiles » -> Run workflow.
name: Exposition aux argiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exposition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pandas geopandas pyogrio
      - run: python src/exposition_argiles.py
      - name: Publier la table de référence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dbt/seeds/exposition_argiles.csv
          git commit -m "Exposition des communes aux argiles (recalcul)" && git push || echo "Aucun changement"

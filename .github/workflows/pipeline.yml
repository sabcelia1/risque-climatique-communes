# Mise à jour automatique : chaque lundi, le pipeline télécharge la dernière base
# GASPAR, la nettoie, la teste, la charge dans BigQuery et reconstruit les modèles dbt.
name: Pipeline de données

on:
  schedule:
    - cron: "17 5 * * 1"     # lundi 5 h 17 UTC
  workflow_dispatch:          # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: ["src/**", "dbt/**", "tests/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: read
  id-token: write      # jeton OIDC : GitHub prouve son identité à Google, sans clé

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Identifiants publics (pas des secrets) : voir docs/guide_gcp.md
      GCP_PROJECT_ID: risques-climatiuqes-communes
      GCP_SERVICE_ACCOUNT: pipeline-risque@risques-climatiuqes-communes.iam.gserviceaccount.com
      GCP_WIF_PROVIDER: projects/889147939867/locations/global/workloadIdentityPools/github/providers/github-repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        run: pip install -r requirements.txt

      - name: Tests unitaires
        run: python -m pytest -q

      - name: Téléchargement des données
        run: python src/ingest.py

      - name: Nettoyage et contrôles qualité
        run: python src/clean.py

      - name: Modèles dbt et tests (DuckDB)
        run: python src/lancer_dbt.py local

      - name: Modèle de prédiction (LightGBM, SHAP)
        run: python src/modele.py

      - name: Connexion à Google Cloud (fédération d'identité, sans clé)
        if: env.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Chargement dans BigQuery
        if: env.GCP_WIF_PROVIDER != ''
        run: python src/load_bigquery.py

      - name: Modèles dbt et tests (BigQuery)
        if: env.GCP_WIF_PROVIDER != ''
        run: python src/lancer_dbt.py bigquery

      - name: Rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: |
            reports/
            data/processed/predictions.parquet
          if-no-files-found: ignore
